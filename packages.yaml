defaults:
  exec_timeout: 1200
  testing_folder: tests
  source: pypi

packages:
  flask:
    exec_timeout: 120
    protected_root_files: [pyproject.toml, setup.cfg, tox.ini]
    chains:
      - { range: ["2.0.0", "2.3.3"], dockerfile: dockerfiles/flask-2.Dockerfile }

  jinja2:
    exec_timeout: 120
    source: github
    repo: pallets/jinja
    protected_root_files: [setup.cfg, tox.ini]
    chains:
      - { range: ["2.8.0", "2.10.3"], dockerfile: dockerfiles/jinja2.Dockerfile }

  pyjwt:
    exec_timeout: 120
    protected_root_files: [pyproject.toml, setup.cfg, tox.ini]
    chains:
      - { range: ["2.0.0", "2.12.2"], dockerfile: dockerfiles/pyjwt-2.Dockerfile }

  attrs:
    exec_timeout: 300
    protected_root_files: [conftest.py, pyproject.toml, setup.cfg, tox.ini]
    chains:
      - { range: ["21.1.0", "26.1.0"], dockerfile: dockerfiles/attrs-23.Dockerfile }

  pytest:
    exec_timeout: 900
    testing_folder: testing
    protected_root_files: [pyproject.toml, setup.cfg, tox.ini]
    chains:
      - range: ["7.0.0", "7.2.0"]
        dockerfile: dockerfiles/pytest-7.Dockerfile
        build_args:
          PYGMENTS_SPEC: "pygments>=2.7.2,<2.14"
          EXCEPTIONGROUP_NO_PATCH: "1"
      - { range: ["7.2.1", "7.4.4"], dockerfile: dockerfiles/pytest-7.Dockerfile }
      - range: ["8.0.0", "8.4.2"]
        dockerfile: dockerfiles/pytest-8.Dockerfile
        exclude_versions:
          - { version: "8.1.0", reason: "yanked from PyPI" }
          - { version: "8.3.1", reason: "no task extracted" }

  poetry:
    exec_timeout: 600
    protected_root_files: [pyproject.toml]
    chains:
      - range: ["1.0.0", "1.8.5"]
        dockerfile: dockerfiles/poetry-1.Dockerfile
        exclude_versions:
          - { version: "1.6.1", reason: "no Python source or test diff vs 1.6.0" }

  xarray:
    exec_timeout: 1800
    testing_folder: xarray/tests
    protected_root_files: [conftest.py, pyproject.toml, setup.cfg]
    chains:
      - { range: ["2022.11.0", "2023.7.0"], dockerfile: dockerfiles/xarray-22.Dockerfile }
      - { range: ["2025.6.0", "2026.2.0"], dockerfile: dockerfiles/xarray-26.Dockerfile }

  conan:
    exec_timeout: 1800
    testing_folder: test
    source: github
    repo: conan-io/conan
    protected_root_files: [pyproject.toml, pytest.ini, setup.cfg]
    chains:
      - { range: ["2.4.0", "2.28.1"], dockerfile: dockerfiles/conan-2.Dockerfile }

  urllib3:
    exec_timeout: 900
    testing_folder: test
    protected_dirs: [dummyserver]
    protected_root_files: [pyproject.toml]
    chains:
      - { range: ["2.0.0", "2.6.3"], dockerfile: dockerfiles/urllib3.Dockerfile }
